<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CM Billing Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8fb;color:#142430}header{padding:20px;background:#fff;border-bottom:1px solid #dbe8ee;display:flex;justify-content:space-between}a{color:#07385d;font-weight:700;text-decoration:none}main{max-width:1200px;margin:auto;padding:25px}h1,h2,h3{color:#07385d}.panel,.card{background:#fff;border:1px solid #dbe8ee;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;font-weight:bold;display:grid;gap:5px}input,select,textarea{padding:11px;border:1px solid #cfdfe7;border-radius:6px;font-size:16px}.btn{padding:10px 13px;border:0;border-radius:6px;background:#0b83c6;color:white;font-weight:bold;cursor:pointer}.soft{background:#eef6fa;color:#07385d}.item{display:grid;grid-template-columns:1fr 90px 130px 40px;gap:7px;margin:7px 0}.row{display:flex;justify-content:space-between;gap:15px}.money{font-size:20px;font-weight:bold;color:#07385d}.badge{font-size:11px;font-weight:bold;padding:5px 8px;background:#e7f4fb;border-radius:99px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}@media(max-width:650px){main{padding:15px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:1fr 60px 90px 35px}.row{display:block}}@media print{header,.actions,.no-print{display:none}body{background:#fff}.card{border:0}}</style></head><body><header><a href="admin.html">CM Technologies · Admin</a><a href="admin-quotations.html">Quotations</a></header><main><h1>Invoices & Payments</h1><p>Create invoices, record payments and manage balances.</p><section class="panel"><h3>Create Invoice</h3><form id="form" class="grid"><label>Client<select id="client" required></select></label><label>Project<select id="project" required></select></label><label>Invoice Number<input id="num" required placeholder="CMT-INV-2026-001"></label><label>Due Date<input id="due" type="date"></label><label>Discount<input id="discount" type="number" value="0"></label><label>Tax<input id="tax" type="number" value="0"></label><div class="full"><b>Items</b><div id="items"></div><button class="btn soft" type="button" id="add">+ Add Item</button></div><label class="full">Notes<textarea id="notes"></textarea></label><button class="btn">Create Invoice</button></form></section><section id="list"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://qwcnownpgjzaeuqaulvz.supabase.co','sb_publishable_drkh09ngSxCqH7dgGHc9bg_DKoxxz5w'),$=s=>document.querySelector(s);let clients=[],projects=[],invoices=[];const money=n=>'R '+Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2});
function add(){let x=document.createElement('div');x.className='item';x.innerHTML='<input class="d" placeholder="Description" required><input class="q" type="number" value="1"><input class="p" type="number" value="0"><button type="button">×</button>';x.lastChild.onclick=()=>x.remove();items.append(x)}add();add.onclick=add;
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='admin-login.html';let c=await sb.rpc('admin_list_clients');if(c.error)c=await sb.from('client_profiles').select('*');clients=c.data||[];projects=(await sb.from('client_projects').select('*')).data||[];client.innerHTML='<option value="">Select client</option>'+clients.map(x=>`<option value="${x.user_id}">${x.full_name||x.email||'Client'}</option>`).join('');filter();load()}
function filter(){project.innerHTML='<option value="">Select project</option>'+projects.filter(x=>!client.value||x.client_id===client.value).map(x=>`<option value="${x.id}">${x.title}</option>`).join('')}client.onchange=filter;
async function load(){let r=await sb.from('client_invoices').select('*').order('created_at',{ascending:false});invoices=r.data||[];list.innerHTML=invoices.map(i=>`<article class="card"><div class="row"><div><b>${i.invoice_number}</b><p><span class="badge">${i.status}</span> · Due ${i.due_date||'—'}</p></div><div class="money">${money(i.amount)}</div></div><p>Paid: ${money(i.amount_paid)} · Balance: ${money(+i.amount-+i.amount_paid)}</p><div class="actions"><button class="btn" onclick="pay('${i.id}','${i.client_id}')">Record Payment</button><a class="btn soft" href="client-billing.html?invoice=${i.id}" target="_blank">Print / PDF</a></div></article>`).join('')||'<div class="panel">No invoices yet.</div>'}
form.onsubmit=async e=>{e.preventDefault();let rows=[...document.querySelectorAll('.item')].map(x=>({description:x.querySelector('.d').value,quantity:+x.querySelector('.q').value,unit_price:+x.querySelector('.p').value}));let q=await sb.from('client_invoices').insert({client_id:client.value,project_id:project.value,invoice_number:num.value,amount:0,due_date:due.value||null,status:'unpaid',discount:+discount.value,tax:+tax.value,notes:notes.value}).select().single();if(q.error)return alert(q.error.message);let r=await sb.from('invoice_items').insert(rows.map((x,i)=>({...x,invoice_id:q.data.id,sort_order:i})));if(r.error)return alert(r.error.message);await sb.rpc('cm_recalculate_invoice',{p_invoice:q.data.id});location.reload()}
window.pay=async(id,cid)=>{let amount=prompt('Amount paid (R)');if(!amount||isNaN(amount))return;let method=prompt('Method','EFT')||'EFT';let ref=prompt('Reference','')||null;const {data:{user}}=await sb.auth.getUser();let r=await sb.from('client_payments').insert({invoice_id:id,client_id:cid,amount:+amount,payment_method:method,reference:ref,recorded_by:user.id});if(r.error)alert(r.error.message);else load()};boot();
</script></body></html>
