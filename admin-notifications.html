<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CM Technologies | Admin Notifications</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>
:root{--n:#07385d;--b:#0b83c6;--bg:#f4f8fb;--ink:#142430;--m:#687985;--l:#dbe8ee;--green:#1f9d73}
*{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{height:72px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}
.brand{font-weight:800;color:var(--n);text-decoration:none}.brand b{background:var(--n);color:#fff;border-radius:8px;padding:11px;margin-right:8px}
main{width:min(980px,100%);margin:auto;padding:28px}h1{font-size:2.5rem;color:var(--n);margin:8px 0}.sub{color:var(--m)}
.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0}.btn{border:0;border-radius:7px;background:var(--b);color:#fff;padding:10px 13px;font-weight:800;cursor:pointer}.soft{background:#fff;color:var(--n);border:1px solid var(--l)}
.notification{background:#fff;border:1px solid var(--l);border-radius:10px;padding:16px;margin:10px 0;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start}.notification.unread{border-left:4px solid var(--b);background:#fbfdff}.icon{width:42px;height:42px;border-radius:9px;background:#eaf6fb;color:var(--b);display:grid;place-items:center}.notification h3{font-size:.9rem;color:var(--n);margin:1px 0 5px}.notification p{font-size:.8rem;color:var(--m);line-height:1.5;margin:0}.meta{font-size:.68rem;color:#8799a3;margin-top:7px}.dot{width:9px;height:9px;border-radius:50%;background:var(--b);margin-top:7px}.empty{background:#fff;border:1px solid var(--l);border-radius:10px;text-align:center;color:var(--m);padding:45px 15px}.count{background:#e7f4fb;color:#0878b4;padding:6px 9px;border-radius:999px;font-size:.7rem;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions a,.actions button{font-size:.7rem;font-weight:800;color:var(--n);background:#eef6fa;border:0;border-radius:6px;padding:7px 9px;text-decoration:none;cursor:pointer}
@media(max-width:600px){header{padding:0 12px}main{padding:20px 11px}h1{font-size:2rem}.notification{grid-template-columns:40px 1fr}.notification>.dot{display:none}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><a class="brand" href="admin.html"><b>CM</b>CM Technologies</a><a href="admin.html" style="color:#07385d;font-weight:800;text-decoration:none"><i class="fa-solid fa-arrow-left"></i> Back</a></header>
<main><div style="color:#0b83c6;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em">Realtime notification centre</div><h1>Admin Notifications</h1><p class="sub">Live activity across clients, requests, quotations, projects and billing.</p><div class="toolbar"><span class="count" id="count">0 unread</span><button class="btn soft" id="markAll"><i class="fa-solid fa-check-double"></i> Mark all as read</button></div><section id="list"><div class="empty">Loading notifications...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://qwcnownpgjzaeuqaulvz.supabase.co','sb_publishable_drkh09ngSxCqH7dgGHc9bg_DKoxxz5w');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let user=null,rows=[];
const icon=t=>({new_client:'fa-user-plus',project_request:'fa-clipboard-list',request_status:'fa-clipboard-check',quotation:'fa-file-signature',quotation_response:'fa-file-circle-check',project:'fa-diagram-project',project_update:'fa-chart-line',invoice:'fa-file-invoice-dollar',payment:'fa-circle-check',message:'fa-comment-dots',file:'fa-file-arrow-down'}[t]||'fa-bell');
const ago=d=>{let s=Math.max(1,Math.floor((Date.now()-new Date(d))/1000));if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return new Date(d).toLocaleDateString('en-ZA')};
async function load(){let r=await sb.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100);if(r.error)return list.innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';rows=r.data||[];render()}
function render(){let unread=rows.filter(x=>!x.is_read).length;count.textContent=unread+' unread';list.innerHTML=rows.map(n=>`<article class="notification ${!n.is_read?'unread':''}"><span class="icon"><i class="fa-solid ${icon(n.type)}"></i></span><div><h3>${esc(n.title)}</h3><p>${esc(n.body||'')}</p><div class="meta">${ago(n.created_at)}</div><div class="actions">${n.link?`<a href="${esc(n.link)}" onclick="mark('${n.id}')">Open</a>`:''}${!n.is_read?`<button onclick="mark('${n.id}')">Mark read</button>`:''}</div></div>${!n.is_read?'<span class="dot"></span>':''}</article>`).join('')||'<div class="empty"><i class="fa-regular fa-bell" style="font-size:2rem"></i><br><br>No notifications yet.</div>'}
window.mark=async id=>{await sb.from('notifications').update({is_read:true}).eq('id',id).eq('user_id',user.id);load()};
markAll.onclick=async()=>{await sb.from('notifications').update({is_read:true}).eq('user_id',user.id).eq('is_read',false);load()};

(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('admin-login.html');user=session.user;let a=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(!a.data)return location.replace('admin-login.html');await load();sb.channel('notification-centre-admin-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:'user_id=eq.'+user.id},load).subscribe()})();
</script></body></html>
