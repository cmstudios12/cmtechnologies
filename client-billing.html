<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CM Technologies Billing</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8fb;color:#142430}header{padding:20px;background:#fff;border-bottom:1px solid #dbe8ee;display:flex;justify-content:space-between}a{color:#07385d;font-weight:700;text-decoration:none}main{max-width:1200px;margin:auto;padding:25px}h1,h2,h3{color:#07385d}.panel,.card{background:#fff;border:1px solid #dbe8ee;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;font-weight:bold;display:grid;gap:5px}input,select,textarea{padding:11px;border:1px solid #cfdfe7;border-radius:6px;font-size:16px}.btn{padding:10px 13px;border:0;border-radius:6px;background:#0b83c6;color:white;font-weight:bold;cursor:pointer}.soft{background:#eef6fa;color:#07385d}.item{display:grid;grid-template-columns:1fr 90px 130px 40px;gap:7px;margin:7px 0}.row{display:flex;justify-content:space-between;gap:15px}.money{font-size:20px;font-weight:bold;color:#07385d}.badge{font-size:11px;font-weight:bold;padding:5px 8px;background:#e7f4fb;border-radius:99px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}@media(max-width:650px){main{padding:15px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:1fr 60px 90px 35px}.row{display:block}}@media print{header,.actions,.no-print{display:none}body{background:#fff}.card{border:0}}</style></head><body><header><a href="client-portal.html">CM Technologies · Client</a><a class="no-print" href="client-portal.html">Back to Portal</a></header><main><h1 class="no-print">Invoices & Receipts</h1><section id="list"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://qwcnownpgjzaeuqaulvz.supabase.co','sb_publishable_drkh09ngSxCqH7dgGHc9bg_DKoxxz5w'),money=n=>'R '+Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2});
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='client-auth.html';let r=await sb.from('client_invoices').select('*').eq('client_id',session.user.id).order('created_at',{ascending:false});let invoices=r.data||[],ids=invoices.map(x=>x.id),items=[],payments=[];if(ids.length){items=(await sb.from('invoice_items').select('*').in('invoice_id',ids).order('sort_order')).data||[];payments=(await sb.from('client_payments').select('*').in('invoice_id',ids)).data||[]}let wanted=new URLSearchParams(location.search).get('invoice');if(wanted)invoices=invoices.filter(x=>x.id===wanted);list.innerHTML=invoices.map(i=>{let its=items.filter(x=>x.invoice_id===i.id),ps=payments.filter(x=>x.invoice_id===i.id);return `<article class="card"><div class="row"><div><h2>CM Technologies</h2><small>Mbombela · 081 840 1398</small><h3>INVOICE ${i.invoice_number}</h3><p>Due ${i.due_date||'—'} · <span class="badge">${i.status}</span></p></div><div class="money">${money(i.amount)}</div></div><table><tr><th>Description</th><th>Qty</th><th>Price</th><th>Total</th></tr>${its.map(x=>`<tr><td>${x.description}</td><td>${x.quantity}</td><td>${money(x.unit_price)}</td><td>${money(x.line_total)}</td></tr>`).join('')}</table><div class="panel"><b>Total ${money(i.amount)}</b><br>Paid ${money(i.amount_paid)}<br><b>Balance ${money(+i.amount-+i.amount_paid)}</b></div>${ps.map(p=>`<div class="panel"><b>RECEIPT ${p.receipt_number}</b><br>${money(p.amount)} · ${p.payment_method} · ${new Date(p.paid_at).toLocaleDateString('en-ZA')}</div>`).join('')}<div class="actions no-print"><button class="btn" onclick="window.print()">Print / Save PDF</button></div></article>`}).join('')||'<div class="panel">No invoices yet.</div>';if(wanted&&invoices.length)setTimeout(()=>window.print(),500)}load();
</script></body></html>
