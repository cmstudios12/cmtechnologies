<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>CM Technologies | Quotations Admin</title>
    <style>
        :root {
            --n: #07385d;
            --b: #0b83c6;
            --bg: #f4f8fb;
            --ink: #142430;
            --m: #687985;
            --l: #dbe8ee;
            --g: #1f9d73;
            --r: #b94444
        }

        * {
            box-sizing: border-box
        }

        html {
            overflow-x: hidden
        }

        body {
            margin: 0;
            font-family: "DM Sans", sans-serif;
            background: var(--bg);
            color: var(--ink)
        }

        a {
            text-decoration: none;
            color: inherit
        }

        button,
        input,
        textarea,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        header {
            height: 72px;
            background: #fff;
            border-bottom: 1px solid var(--l);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 10
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font: 800 .95rem Manrope;
            color: var(--n)
        }

        .mark {
            width: 40px;
            height: 40px;
            background: var(--n);
            color: #fff;
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: .8rem
        }

        .links {
            display: flex;
            gap: 8px
        }

        .link,
        .btn {
            border: 1px solid var(--l);
            background: #fff;
            border-radius: 7px;
            padding: 10px 13px;
            font-size: .75rem;
            font-weight: 800;
            color: var(--n)
        }

        .btn.primary {
            background: var(--b);
            border-color: var(--b);
            color: #fff
        }

        .btn.danger {
            color: var(--r);
            background: #fff4f4
        }

        main {
            width: min(1280px, 100%);
            margin: auto;
            padding: 28px
        }

        .ey {
            color: var(--b);
            font-size: .67rem;
            font-weight: 800;
            letter-spacing: .13em;
            text-transform: uppercase
        }

        h1 {
            font: 800 clamp(2rem, 4vw, 2.7rem)/1 Manrope;
            color: var(--n);
            letter-spacing: -.05em;
            margin: 7px 0
        }

        .sub {
            color: var(--m);
            margin: 0 0 22px
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px
        }

        .stat,
        .panel,
        .quote {
            background: #fff;
            border: 1px solid var(--l);
            border-radius: 10px
        }

        .stat {
            padding: 16px
        }

        .stat span {
            font-size: .7rem;
            color: var(--m);
            font-weight: 700
        }

        .stat strong {
            display: block;
            font: 800 1.5rem Manrope;
            color: var(--n);
            margin-top: 5px
        }

        .panel {
            padding: 18px;
            margin-bottom: 16px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px
        }

        .full {
            grid-column: 1/-1
        }

        label {
            display: grid;
            gap: 6px;
            font-size: .7rem;
            font-weight: 800;
            color: #536773
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #cfdee6;
            border-radius: 7px;
            padding: 10px 11px;
            font-size: 16px;
            outline: 0;
            background: #fff
        }

        textarea {
            min-height: 90px;
            resize: vertical
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--b);
            box-shadow: 0 0 0 3px rgba(11, 131, 198, .08)
        }

        .items {
            display: grid;
            gap: 8px
        }

        .item {
            display: grid;
            grid-template-columns: 1fr 100px 140px 42px;
            gap: 8px;
            align-items: center
        }

        .item button {
            height: 42px;
            border: 1px solid #efcccc;
            background: #fff4f4;
            color: var(--r);
            border-radius: 7px
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px
        }

        .quote {
            padding: 18px;
            margin-bottom: 12px
        }

        .qt {
            display: flex;
            justify-content: space-between;
            gap: 14px
        }

        .quote h3 {
            font: 800 1.05rem Manrope;
            color: var(--n);
            margin: 0
        }

        .badge {
            padding: 6px 9px;
            border-radius: 999px;
            background: #e7f4fb;
            color: #0878b4;
            font-size: .62rem;
            font-weight: 800;
            text-transform: capitalize;
            height: max-content
        }

        .badge.accepted,
        .badge.converted {
            background: #e4f5ed;
            color: #19815e
        }

        .badge.declined {
            background: #f8e5e5;
            color: #a33c3c
        }

        .money {
            font: 800 1.2rem Manrope;
            color: var(--n)
        }

        .meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            color: var(--m);
            font-size: .72rem;
            margin: 10px 0
        }

        .error {
            background: #fff2f2;
            border: 1px solid #efcccc;
            padding: 11px;
            border-radius: 7px;
            color: #923b3b;
            margin-bottom: 12px;
            display: none
        }

        .error.show {
            display: block
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            text-align: left;
            padding: 11px;
            border-bottom: 1px solid #edf2f5;
            font-size: .76rem
        }

        th {
            font-size: .62rem;
            text-transform: uppercase;
            color: #71838e
        }

        @media(max-width:700px) {
            header {
                padding: 0 12px
            }

            .links .txt {
                display: none
            }

            main {
                padding: 20px 11px
            }

            .stats {
                grid-template-columns: 1fr 1fr
            }

            .grid {
                grid-template-columns: 1fr
            }

            .full {
                grid-column: auto
            }

            .item {
                grid-template-columns: 1fr 70px 100px 40px
            }

            .qt {
                display: block
            }

            .badge {
                display: inline-block;
                margin-top: 8px
            }
        }

        .toast {
            position: fixed;
            right: 20px;
            top: 88px;
            z-index: 100;
            max-width: 390px;
            background: #fff;
            border: 1px solid var(--l);
            border-left: 4px solid var(--g);
            border-radius: 10px;
            padding: 14px 16px;
            box-shadow: 0 16px 45px rgba(7, 56, 93, .16);
            display: none;
            font-size: .78rem;
            line-height: 1.45
        }

        .toast.show {
            display: block
        }

        .toast.error-toast {
            border-left-color: var(--r)
        }

        .send-state {
            display: inline-flex;
            align-items: center;
            gap: 7px
        }

        .send-state i {
            font-size: .72rem
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        @media(max-width:390px) {
            .stats {
                grid-template-columns: 1fr
            }

            .toast {
                left: 11px;
                right: 11px;
                top: 82px
            }
        }
    </style>
</head>

<body>
    <header><a class="brand" href="admin.html"><span class="mark">CM</span>CM Technologies <small
                style="color:#82949e">Admin</small></a>
        <div class="links"><a class="link" href="admin-requests.html"><i class="fa-regular fa-clipboard"></i> <span
                    class="txt">Requests</span></a><a class="link" href="admin-clients.html"><i
                    class="fa-solid fa-users"></i> <span class="txt">Clients</span></a></div>
    </header>
    <main>
        <div class="ey">Sales & commercial</div>
        <h1>Quotations</h1>
        <p class="sub">Create professional quotations, send them to clients and convert accepted work into live
            projects.</p>
        <div class="stats">
            <div class="stat"><span>Total</span><strong id="s0">0</strong></div>
            <div class="stat"><span>Awaiting client</span><strong id="s1">0</strong></div>
            <div class="stat"><span>Accepted</span><strong id="s2">0</strong></div>
            <div class="stat"><span>Value</span><strong id="s3">R0</strong></div>
        </div>
        <div class="error" id="err"></div>
        <section class="panel">
            <h3 style="margin-top:0;color:var(--n)">Create quotation</h3>
            <form id="form" class="grid">
                <label>Client<select id="client" required></select></label><label>Project / quotation title<input
                        id="title" required placeholder="Business Website Development"></label>
                <label>Valid until<input id="valid" type="date"></label><label>Deposit %<input id="deposit"
                        type="number" min="0" max="100" value="50"></label>
                <label>Discount (R)<input id="discount" type="number" min="0" step=".01" value="0"></label><label>Tax /
                    VAT (R)<input id="tax" type="number" min="0" step=".01" value="0"></label>
                <label class="full">Description<textarea id="desc" placeholder="Scope summary..."></textarea></label>
                <div class="full"><strong style="font-size:.78rem;color:var(--n)">Quotation items</strong>
                    <div class="items" id="items"></div><button class="btn" type="button" id="addItem"
                        style="margin-top:8px"><i class="fa-solid fa-plus"></i> Add item</button>
                </div>
                <label class="full">Terms<textarea
                        id="terms">50% deposit is required before work begins. Remaining balance is payable before final deployment or handover unless otherwise agreed in writing.</textarea></label>
                <div class="full actions"><button class="btn primary" type="submit"><i
                            class="fa-solid fa-file-circle-plus"></i> Create Quotation</button></div>
            </form>
        </section>
        <section id="list"></section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const sb = supabase.createClient('https://qwcnownpgjzaeuqaulvz.supabase.co', 'sb_publishable_drkh09ngSxCqH7dgGHc9bg_DKoxxz5w');
        let clients = [], quotes = []; const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c])); const money = n => 'R' + Number(n || 0).toLocaleString('en-ZA', { minimumFractionDigits: 2 });
        const error = m => { $('#err').textContent = m || ''; $('#err').classList.toggle('show', !!m) };
        const toast = (m, bad = false) => { const t = $('#toast'); t.textContent = m; t.className = 'toast show' + (bad ? ' error-toast' : ''); clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(() => t.className = 'toast', 4500) };
        const getClient = id => clients.find(x => x.user_id === id);
        const clientEmail = c => c?.email || c?.email_address || c?.user_email || '';
        const clientName = c => c?.full_name || c?.name || c?.email || 'Client';
        async function sendQuotationEmail(q) {
            const c = getClient(q.client_id);
            const to = clientEmail(c);
            if (!to) throw new Error('This client has no email address available. Open Clients and add/repair the client email first.');
            const portalUrl = new URL('client-quotations.html', location.href).href;
            const { data, error: fnError } = await sb.functions.invoke('send-cm-email', {
                body: {
                    to,
                    customerName: clientName(c),
                    type: 'quotation',
                    subject: `Quotation ${q.quotation_number} from CM Technologies`,
                    title: 'Your quotation is ready.',
                    message: `Thank you for choosing CM Technologies. We have prepared your quotation for ${q.title}. Sign in to your secure Client Portal to review the pricing, terms and respond.`,
                    reference: q.quotation_number,
                    service: q.title,
                    amount: money(q.total),
                    buttonText: 'Review Quotation',
                    buttonUrl: portalUrl
                }
            });
            if (fnError) throw new Error(fnError.message || 'The quotation was saved, but the email function failed.');
            if (data?.success === false) throw new Error(data.error || 'The quotation was saved, but Resend did not accept the email.');
            return data;
        }
        async function guard() { const { data: { session } } = await sb.auth.getSession(); if (!session) return location.replace('admin-login.html'); const a = await sb.from('admin_users').select('user_id').eq('user_id', session.user.id).maybeSingle(); if (!a.data) return location.replace('admin-login.html'); return session }
        function addItem(d = '', q = 1, p = 0) { const x = document.createElement('div'); x.className = 'item'; x.innerHTML = `<input class="idesc" required placeholder="Service / item" value="${esc(d)}"><input class="iqty" type="number" min=".01" step=".01" value="${q}"><input class="iprice" type="number" min="0" step=".01" value="${p}"><button type="button"><i class="fa-solid fa-xmark"></i></button>`; x.querySelector('button').onclick = () => x.remove(); $('#items').appendChild(x) } $('#addItem').onclick = () => addItem(); addItem('Website / App Development', 1, 0);
        async function loadClients() { let r = await sb.rpc('admin_list_clients'); if (r.error) r = await sb.from('client_profiles').select('*').order('created_at'); clients = r.data || []; $('#client').innerHTML = '<option value="">Select client</option>' + clients.map(c => `<option value="${c.user_id}">${esc(c.full_name || c.email || 'Client')}</option>`).join('') }
        async function loadQuotes() { const r = await sb.from('client_quotations').select('*').order('created_at', { ascending: false }); if (r.error) return error('Quotation load failed: ' + r.error.message); quotes = r.data || []; render() }
        function cname(id) { const c = clients.find(x => x.user_id === id); return c?.full_name || c?.email || 'Client' }
        function render() { $('#s0').textContent = quotes.length; $('#s1').textContent = quotes.filter(q => q.status === 'sent').length; $('#s2').textContent = quotes.filter(q => q.status === 'accepted').length; $('#s3').textContent = 'R' + Math.round(quotes.reduce((a, q) => a + Number(q.total || 0), 0)).toLocaleString('en-ZA'); $('#list').innerHTML = quotes.map(q => `<article class="quote"><div class="qt"><div><h3>${esc(q.quotation_number)} · ${esc(q.title)}</h3><div class="meta"><span><i class="fa-regular fa-user"></i> ${esc(cname(q.client_id))}</span><span>Valid: ${q.valid_until || 'Not set'}</span><span>Deposit: ${q.deposit_percent}%</span></div></div><div><div class="money">${money(q.total)}</div><span class="badge ${q.status}">${q.status}</span></div></div><div class="actions">${q.status === 'draft' ? `<button class="btn primary" onclick="sendQuote('${q.id}',this)"><i class="fa-regular fa-paper-plane"></i> Send to Client</button>` : ''}${q.status === 'accepted' ? `<button class="btn primary" onclick="convert('${q.id}')"><i class="fa-solid fa-diagram-project"></i> Convert to Project</button>` : ''}<button class="btn danger" onclick="delQuote('${q.id}')">Delete</button></div></article>`).join('') || '<div class="panel">No quotations yet.</div>' }
        $('#form').onsubmit = async e => { e.preventDefault(); error(''); const items = [...document.querySelectorAll('.item')].map(x => ({ description: x.querySelector('.idesc').value.trim(), quantity: +x.querySelector('.iqty').value, unit_price: +x.querySelector('.iprice').value })).filter(x => x.description); if (!items.length) return error('Add at least one quotation item.'); const { data: { user } } = await sb.auth.getUser(); const q = await sb.from('client_quotations').insert({ client_id: $('#client').value, title: $('#title').value.trim(), description: $('#desc').value.trim() || null, valid_until: $('#valid').value || null, deposit_percent: +$('#deposit').value, discount: +$('#discount').value, tax: +$('#tax').value, terms: $('#terms').value.trim() || null, created_by: user.id }).select().single(); if (q.error) return error(q.error.message); const ins = await sb.from('quotation_items').insert(items.map((x, i) => ({ ...x, quotation_id: q.data.id, sort_order: i }))); if (ins.error) return error(ins.error.message); e.target.reset(); $('#items').innerHTML = ''; addItem('Website / App Development', 1, 0); await loadQuotes() };
        window.sendQuote = async (id, btn) => {
            error('');
            const q = quotes.find(x => x.id === id);
            if (!q) return error('Quotation could not be found.');
            const c = getClient(q.client_id);
            if (!clientEmail(c)) return error('Cannot send this quotation because the selected client has no email address.');
            const button = btn || event?.currentTarget;
            const original = button?.innerHTML;
            if (button) { button.disabled = true; button.innerHTML = '<span class="send-state"><i class="fa-solid fa-spinner fa-spin"></i> Sending...</span>' }
            try {
                const r = await sb.from('client_quotations').update({ status: 'sent', updated_at: new Date().toISOString() }).eq('id', id).eq('status', 'draft');
                if (r.error) throw new Error(r.error.message);
                await sendQuotationEmail(q);
                toast(`Quotation ${q.quotation_number} sent to ${clientEmail(c)}.`);
                await loadQuotes();
            } catch (e) {
                error(e.message || 'Could not send quotation email.');
                toast(e.message || 'Could not send quotation email.', true);
                if (button) { button.disabled = false; button.innerHTML = original }
            }
        };
        window.delQuote = async id => { if (!confirm('Delete this quotation?')) return; const r = await sb.from('client_quotations').delete().eq('id', id); if (r.error) return error(r.error.message); loadQuotes() };
        window.convert = async id => { const q = quotes.find(x => x.id === id); if (!q) return; if (!confirm('Create a live project from this accepted quotation?')) return; const p = await sb.from('client_projects').insert({ client_id: q.client_id, title: q.title, description: q.description, status: 'planning', progress: 0 }).select('id').single(); if (p.error) return error(p.error.message); const u = await sb.from('client_quotations').update({ status: 'converted', project_id: p.data.id, updated_at: new Date().toISOString() }).eq('id', id); if (u.error) return error(u.error.message); loadQuotes() };
        (async () => { if (!(await guard())) return; await loadClients(); await loadQuotes(); sb.channel('quotes-admin').on('postgres_changes', { event: '*', schema: 'public', table: 'client_quotations' }, loadQuotes).subscribe() })();
    </script>
</body>

</html>
